<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>vhih Configuration</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      max-width: 900px;
    }
    .section {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    .section:nth-of-type(1) {
      background: #f3f8ff;
    }
    .section:nth-of-type(2) {
      background: #f9f3ff;
    }
    .section:nth-of-type(3) {
      background: #f3fff4;
    }
    .section:nth-of-type(4) {
      background: #fffaf3;
    }
    .section h2 {
      margin-top: 0;
    }
    label {
      display: block;
      margin: 5px 0;
    }
    input, select {
      padding: 5px;
      margin-top: 2px;
      width: 100%;
      box-sizing: border-box;
    }
    .sensor {
      margin-bottom: 10px;
      border-bottom: 1px dashed #ccc;
      padding-bottom: 10px;
    }
    .timestamp {
      font-size: 0.9em;
      color: #666;
    }
    .signal-group {
      margin: 10px 0;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 5px;
    }
    .signal-group h4 {
      margin: 0 0 10px 0;
      font-size: 1em;
    }
    .signal-inputs {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .signal-inputs input {
      width: auto;
      flex: 1;
    }
    .signal-inputs label {
      margin: 0;
      flex: 1;
    }
    .hidden {
      display: none;
    }
    .error {
      color: red;
      font-weight: bold;
    }
    .success {
      color: green;
      font-weight: bold;
    }
    .checkbox-row {
      display: inline-flex;
      align-items: center;
      gap: 0.5em;
      margin-bottom: 10px;
    }
    .checkbox-row input[type="checkbox"] {
      margin: 0;
    }
    .checkbox-row label {
      margin: 0;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <h1>vhih Configuration</h1>

  <div class="section">
    <h2>System</h2>
    <p><b>Firmware:</b> <span id="fwver">?</span></p>

    <div class="checkbox-row">
      <input type="checkbox" id="cfgInSTA">
      <label for="cfgInSTA">Enable configuration in standard mode</label>
    </div>
    <div>
      <button onclick="restartDevice()">Restart</button>
    </div>      
    <hr>
    <h3>OTA Update</h3>
    <form id="updateForm" enctype="multipart/form-data">
      <input type="file" name="update" id="updateFile" accept=".bin">
      <button type="button" onclick="uploadFirmware()">Update Firmware</button>
    </form>
    <div id="updateStatus"></div>
  </div>

  <div class="section">
    <h2>WiFi Configuration</h2>
    <label>SSID: <input type="text" id="ssid"></label>
    <label>Password: <input type="password" id="pw"></label>
    <label>Gateway IP: <input type="text" id="gw"></label>
    <label>SubNet Mask: <input type="text" id="mask"></label>
    <label>Client IP: <input type="text" id="ip"></label>
  </div>

  <div class="section">
    <h2>Last Received Signal</h2>
    <label>Sensor Address (hex): <input type="text" id="sensorAddress" readonly></label>
    <label>Value: <input type="text" id="sensorData" readonly></label>
    <label>Binary: <input type="text" id="binary" readonly></label>
    <p class="timestamp" id="timestamp"></p>
  </div>

  <div class="section">
    <h2>Sensor Configuration</h2>
    <div id="sensorList"></div>
    <button onclick="saveConfig()">💾 Save Configuration</button>
    <hr>
    <a href="/config.json" download>🡇 Download configuration</a><br><br>
    <input type="file" id="cfgfile" accept=".json">
    <button onclick="uploadConfig()">Upload Config File</button>
  </div>


<script>
function restartDevice() {
  if (confirm('Device will restart. Continue?')) {
    fetch('/restart', { method: 'POST' })
      .then(() => alert('Device is restarting...'))
      .catch(() => alert('Restart command sent'));
  }
}

function uploadFirmware() {
  const fileInput = document.getElementById("updateFile");
  const file = fileInput.files[0];
  const statusDiv = document.getElementById("updateStatus");
  
  if (!file) {
    statusDiv.innerHTML = '<div class="error">No file selected</div>';
    return;
  }
  
  if (!file.name.endsWith('.bin')) {
    statusDiv.innerHTML = '<div class="error">Please select a .bin firmware file</div>';
    return;
  }
  
  const formData = new FormData();
  formData.append('update', file);
  
  statusDiv.innerHTML = '<div>Uploading firmware...</div>';
  
  fetch('/update', {
    method: 'POST',
    body: formData
  })
  .then(response => {
    if (response.ok) {
      statusDiv.innerHTML = '<div class="success">Firmware uploaded successfully! Device will restart.</div>';
    } else {
      statusDiv.innerHTML = '<div class="error">Firmware upload failed. Please try again.</div>';
    }
  })
  .catch(error => {
    console.error('Upload error:', error);
    statusDiv.innerHTML = '<div class="error">Upload failed: ' + error.message + '</div>';
  });
}

function uploadConfig() {
  const fileInput = document.getElementById("cfgfile");
  const file = fileInput.files[0];
  if (!file) return alert("No file selected");
  
  if (!file.name.endsWith('.json')) {
    alert("Please select a JSON configuration file");
    return;
  }
  
  const reader = new FileReader();
  reader.onload = function () {
    try {
      // Validate JSON before upload
      JSON.parse(reader.result);
      
      fetch("/config.json", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: reader.result
      }).then(res => {
        if (res.ok) {
          alert("Configuration uploaded successfully!");
          location.reload(); // Reload to show new config
        } else {
          alert("Upload failed: " + res.statusText);
        }
      }).catch(err => {
        alert("Upload failed: " + err.message);
      });
    } catch (e) {
      alert("Invalid JSON file: " + e.message);
    }
  };
  reader.readAsText(file);
}

let list = document.getElementById("sensorList");

// Sensor type configurations - FIXED: Use backend-expected type names
const sensorTypeConfigs = {
  "OpenClose": {
    backendType: "OpenClose Sensor",
    signals: [
      { name: "Open Signal", key: "signal1", delayKey: "delay1", needsDelay: false },
      { name: "Close Signal", key: "signal2", delayKey: "delay2", needsDelay: false },
      { name: "Alarm Signal", key: "signal3", delayKey: "delay3", needsDelay: true },
      { name: "Battery Signal", key: "signal4", delayKey: "delay4", needsDelay: true }
    ]
  },
  "OneButton": {
    backendType: "OneButton Remote",
    signals: [
      { name: "Button Signal", key: "signal1", delayKey: "delay1", needsDelay: true }
    ]
  },
  "TwoButton": {
    backendType: "TwoButton Remote",
    signals: [
      { name: "Button 1 Signal", key: "signal1", delayKey: "delay1", needsDelay: true },
      { name: "Button 2 Signal", key: "signal2", delayKey: "delay2", needsDelay: true }
    ]
  },
  "ThreeButton": {
    backendType: "ThreeButton Remote",
    signals: [
      { name: "Button 1 Signal", key: "signal1", delayKey: "delay1", needsDelay: true },
      { name: "Button 2 Signal", key: "signal2", delayKey: "delay2", needsDelay: true },
      { name: "Button 3 Signal", key: "signal3", delayKey: "delay3", needsDelay: true }
    ]
  },
  "FourButton": {
    backendType: "FourButton Remote",
    signals: [
      { name: "Button 1 Signal", key: "signal1", delayKey: "delay1", needsDelay: true },
      { name: "Button 2 Signal", key: "signal2", delayKey: "delay2", needsDelay: true },
      { name: "Button 3 Signal", key: "signal3", delayKey: "delay3", needsDelay: true },
      { name: "Button 4 Signal", key: "signal4", delayKey: "delay4", needsDelay: true }
    ]
  }
};

// FIXED: Function to map backend type names to frontend keys
function getTypeKeyFromBackendType(backendType) {
  for (const [key, config] of Object.entries(sensorTypeConfigs)) {
    if (config.backendType === backendType) {
      return key;
    }
  }
  return "OpenClose"; // default
}

function renderSensors(sensors) {
  list.innerHTML = "";
  if (!sensors || sensors.length === 0) {
    sensors = [emptySensor()];
  }

  sensors.forEach((s, i) => {
    let row = document.createElement("div");
    row.className = "sensor";
    row.dataset.index = i;
    
    // FIXED: Map backend type to frontend key
    const frontendType = getTypeKeyFromBackendType(s.type);
    
    // Create signal groups HTML
    let signalGroupsHTML = "";
    Object.keys(sensorTypeConfigs).forEach(type => {
      const config = sensorTypeConfigs[type];
      const isVisible = frontendType === type;
      
      signalGroupsHTML += `<div class="signal-type-group ${isVisible ? '' : 'hidden'}" data-type="${type}">`;
      
      config.signals.forEach(signal => {
        const signalValue = s[signal.key] ?? 0;
        // FIXED: Better NaN handling
        let delayValue = "";
        if (s[signal.delayKey] !== undefined && s[signal.delayKey] !== null && !isNaN(s[signal.delayKey])) {
          delayValue = s[signal.delayKey];
        }
        
        const delayHTML = signal.needsDelay ? 
          `<label>Delay (s): <input type="number" class="${signal.delayKey}" value="${delayValue}" min="0" step="0.1" placeholder="No delay"></label>` : 
          `<input type="hidden" class="${signal.delayKey}" value="">`;
        
        signalGroupsHTML += `
          <div class="signal-group">
            <h4>${signal.name}</h4>
            <div class="signal-inputs">
              <label>Value: <input type="number" class="${signal.key}" value="${signalValue}"></label>
              ${delayHTML}
            </div>
          </div>
        `;
      });
      
      signalGroupsHTML += "</div>";
    });
    
    row.innerHTML = `
      <b>Sensor ${i + 1}</b><br>
      <label style="display: inline-flex; align-items: center;">
        <input type="checkbox" class="active" ${s.active ? "checked" : ""}>
        <span style="margin-left: 0.5em;">activated</span>
      </label>
      <label>Type:
        <select class="type" onchange="updateSensorTypeVisibility(${i})">
          <option value="OpenClose" ${frontendType === "OpenClose" ? "selected" : ""}>OpenClose Sensor</option>
          <option value="OneButton" ${frontendType === "OneButton" ? "selected" : ""}>OneButton Remote</option>
          <option value="TwoButton" ${frontendType === "TwoButton" ? "selected" : ""}>TwoButton Remote</option>
          <option value="ThreeButton" ${frontendType === "ThreeButton" ? "selected" : ""}>ThreeButton Remote</option>
          <option value="FourButton" ${frontendType === "FourButton" ? "selected" : ""}>FourButton Remote</option>
        </select>
      </label>
      <label>Name: <input type="text" class="name" value="${s.name || ""}"></label>
      <label>homee ID: <input type="number" class="homeeID" min="1" max="65535" value="${s.homeeID || ""}"></label>
      <label>Address (hex): <input type="text" class="address" value="${(s.address ?? 0).toString(16)}" pattern="[0-9a-fA-F]{1,8}" title="Hex value"></label>
      
      ${signalGroupsHTML}
      
      <button onclick="addSensor(${i})">+</button>
      ${i > 0 ? `<button onclick="removeSensor(${i})">-</button>` : ""}
      <hr>
    `;
    list.appendChild(row);
  });
}

function updateSensorTypeVisibility(sensorIndex) {
  const sensorRow = document.querySelector(`[data-index="${sensorIndex}"]`);
  const typeSelect = sensorRow.querySelector('.type');
  const selectedType = typeSelect.value;
  
  // Hide all signal type groups
  sensorRow.querySelectorAll('.signal-type-group').forEach(group => {
    group.classList.add('hidden');
  });
  
  // Show the selected type group
  const selectedGroup = sensorRow.querySelector(`[data-type="${selectedType}"]`);
  if (selectedGroup) {
    selectedGroup.classList.remove('hidden');
  }
}

function emptySensor() {
  return {
    active: true,
    name: "",
    homeeID: 0,
    type: "OpenClose Sensor",
    address: 0,
    signal1: 0,  // FIXED: Change from -1 to 0
    signal2: 0,  // FIXED: Change from -1 to 0
    signal3: 0,  // FIXED: Change from -1 to 0
    signal4: 0,  // FIXED: Change from -1 to 0
    delay1: null,
    delay2: null,
    delay3: null,
    delay4: null
  };
}

function collectSensors() {
  const sensors = [];
  document.querySelectorAll(".sensor").forEach(s => {
    const frontendType = s.querySelector(".type").value;
    const backendType = sensorTypeConfigs[frontendType]?.backendType || "OpenClose Sensor";
    
    // Get address as hex number (not string)
    const addressStr = s.querySelector(".address").value.trim();
    const addressValue = addressStr ? parseInt(addressStr, 16) : 0;
    
    const sensorData = {
      active: s.querySelector(".active").checked,
      name: s.querySelector(".name").value.trim(),
      homeeID: parseInt(s.querySelector(".homeeID").value) || 0,
      type: backendType,
      address: addressValue,
      signal1: 0,
      signal2: 0,
      signal3: 0,
      signal4: 0,
      delay1: null,
      delay2: null,
      delay3: null,
      delay4: null
    };
    
    // FIXED: Only read from the visible signal group
    const visibleGroup = s.querySelector(`.signal-type-group[data-type="${frontendType}"]:not(.hidden)`);
    if (visibleGroup) {
      // Read signal values from visible group only
      const signal1Input = visibleGroup.querySelector(".signal1");
      const signal2Input = visibleGroup.querySelector(".signal2");
      const signal3Input = visibleGroup.querySelector(".signal3");
      const signal4Input = visibleGroup.querySelector(".signal4");
      
      if (signal1Input) sensorData.signal1 = parseInt(signal1Input.value) || 0;
      if (signal2Input) sensorData.signal2 = parseInt(signal2Input.value) || 0;
      if (signal3Input) sensorData.signal3 = parseInt(signal3Input.value) || 0;
      if (signal4Input) sensorData.signal4 = parseInt(signal4Input.value) || 0;
      
      // Read delay values from visible group only
      const delay1Input = visibleGroup.querySelector(".delay1");
      const delay2Input = visibleGroup.querySelector(".delay2");
      const delay3Input = visibleGroup.querySelector(".delay3");
      const delay4Input = visibleGroup.querySelector(".delay4");
      
      if (delay1Input) {
        const delay1 = delay1Input.value.trim();
        sensorData.delay1 = (delay1 === "" || delay1 === "NaN") ? null : parseFloat(delay1);
      }
      if (delay2Input) {
        const delay2 = delay2Input.value.trim();
        sensorData.delay2 = (delay2 === "" || delay2 === "NaN") ? null : parseFloat(delay2);
      }
      if (delay3Input) {
        const delay3 = delay3Input.value.trim();
        sensorData.delay3 = (delay3 === "" || delay3 === "NaN") ? null : parseFloat(delay3);
      }
      if (delay4Input) {
        const delay4 = delay4Input.value.trim();
        sensorData.delay4 = (delay4 === "" || delay4 === "NaN") ? null : parseFloat(delay4);
      }
    } else {
      console.warn(`No visible signal group found for sensor type: ${frontendType}`);
    }
    
    // Debug output
    console.log(`Sensor ${sensors.length + 1}:`, sensorData);
    
    sensors.push(sensorData);
  });
  return sensors;
}

function addSensor(index) {
  let sensors = collectSensors();
  sensors.splice(index + 1, 0, emptySensor());
  renderSensors(sensors);
}

function removeSensor(index) {
  let sensors = collectSensors();
  if (sensors.length <= 1) return;
  sensors.splice(index, 1);
  renderSensors(sensors);
}

function saveConfig() {
  const data = {
    system: { 
      cfgInSTA: document.getElementById("cfgInSTA").checked,
      cfgInStandardMode: document.getElementById("cfgInSTA").checked // FIXED: Map to both fields
    },
    wifi: {
      ssid: document.getElementById("ssid").value,
      pw: document.getElementById("pw").value,      // FIXED: Use 'pw' for unencrypted
      password: document.getElementById("pw").value, // FIXED: Also send as 'password'
      ip: document.getElementById("ip").value,
      gw: document.getElementById("gw").value,
      mask: document.getElementById("mask").value
    },
    sensors: collectSensors()
  };

  console.log("Saving config:", data); // Debug output

  fetch("/config", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
  .then(response => {
    if (response.ok) {
      alert("Configuration saved successfully.");
    } else {
      alert("Failed to save configuration: " + response.statusText);
    }
  })
  .catch(error => {
    console.error("Save error:", error);
    alert("Failed to save configuration: " + error.message);
  });
}

// FIXED: Better config loading with error handling
fetch("/config")
  .then(res => {
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    }
    return res.json();
  })
  .then(json => {
    console.log("Loaded config:", json); // Debug output
    
    document.getElementById("fwver").textContent = json.fw || "?";
    document.getElementById("cfgInSTA").checked = json.system?.cfgInSTA || json.system?.cfgInStandardMode || false;
    document.getElementById("ssid").value = json.wifi?.ssid || "";
    // FIXED: Handle both 'password' and 'pw' fields
    document.getElementById("pw").value = json.wifi?.password || json.wifi?.pw || "";
    document.getElementById("ip").value = json.wifi?.ip || "";
    document.getElementById("gw").value = json.wifi?.gw || "";
    document.getElementById("mask").value = json.wifi?.mask || "";
    renderSensors(json.sensors || []);
  })
  .catch(error => {
    console.error("Config load error:", error);
    alert("Failed to load configuration: " + error.message);
    // Load with defaults
    renderSensors([]);
  });

document.getElementById("cfgInSTA").addEventListener("change", () => {
  fetch("/updateSystem", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ 
      cfgInSTA: document.getElementById("cfgInSTA").checked,
      cfgInStandardMode: document.getElementById("cfgInSTA").checked
    })
  }).catch(error => {
    console.error("System update error:", error);
  });
});

function updateSignalDisplay(data) {
  document.getElementById("sensorAddress").value = data.sensorAddress || "";
  document.getElementById("sensorData").value = data.sensorData || "";
  document.getElementById("binary").value = data.binary || "";
  document.getElementById("timestamp").textContent = new Date().toLocaleString();
}

// Optional: Polling alle 2s mit Fehlerbehandlung
setInterval(() => {
  fetch("/lastsignal")
    .then(res => {
      if (res.ok) {
        return res.json();
      }
    })
    .then(data => {
      if (data) {
        updateSignalDisplay(data);
      }
    })
    .catch(error => {
      // Silent fail for polling
      console.log("Signal polling error:", error);
    });
}, 2000);
</script>
</body>
</html>
